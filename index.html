<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>websiteku</title>

<!-- KODE ADSTERRA POPUNDER (SUDAH TERPASANG) -->
<script src="https://pl30735591.effectivecpmnetwork.com/eb/a3/ab/eba3ab987ab2d010367a14186c69d988.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        websiteku
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Cari video..."
        >
    </div>
</header>

<main>

<section class="hero">

<div class="video-card" data-title="Video Viral Terbaru">

<video
id="mainVideo"
controls
preload="metadata"
poster="https://dummyimage.com/800x450/111827/ffffff&text=Websiteku"
>
<source src="https://cdn2.sliwtdrive.com/BIYDvcux1.mp4" type="video/mp4">
</video>

<div class="btn-group">
<button onclick="downloadVideo()">Download Video</button>
<button onclick="playAgain()">Putar Ulang</button>
</div>

</div>

</section>

</main>

<!-- Form Remote Upload -->
<div style="max-width: 400px; margin: 20px auto; text-align: center;">
  <h3>Remote Upload Video</h3>
  <input type="text" id="videoUrlInput" placeholder="Masukkan URL Direct Video (.mp4)" style="width: 100%; padding: 10px; margin-bottom: 10px;">
  <button onclick="prosesRemoteUpload()" style="padding: 10px 20px; width: 100%;">Upload Sekarang</button>
  <p id="statusText" style="margin-top: 10px; font-weight: bold;"></p>

  <!-- KOTAK UNTUK SALIN LINK -->
  <div id="resultBox" style="display: none; margin-top: 15px;">
    <p style="margin-bottom: 5px;">Link Video Kamu:</p>
    <input type="text" id="finalLinkInput" readonly style="width: 80%; padding: 8px;">
    <button onclick="copyLink()" style="padding: 8px;">Copy</button>
  </div>
</div>

<script src="script.js"></script>
 
<script>
function copyLink() {
  const copyText = document.getElementById("finalLinkInput");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(copyText.value);
  alert("Link berhasil disalin!");
}

async function prosesRemoteUpload() {
  const videoUrl = document.getElementById('videoUrlInput').value.trim();
  const statusText = document.getElementById('statusText');
  const mainVideo = document.getElementById('mainVideo');
  const resultBox = document.getElementById('resultBox');
  const finalLinkInput = document.getElementById('finalLinkInput');

  if(!videoUrl) {
    statusText.innerText = "Masukkan link video dulu!";
    return;
  }

  statusText.innerText = "Sedang memproses video...";

  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ videoUrl: videoUrl })
    });

    const data = await res.json();

    if (data.success) {
      statusText.innerText = "Berhasil dimuat!";
      
      // BIKIN LINK BERDOMAIN WEB KAMU SENDIRI
      const encodedUrl = encodeURIComponent(videoUrl);
      const myWebLink = window.location.origin + "/?v=" + encodedUrl;

      // ISI KOTAK INPUT PAKAI LINK WEB KAMU
      finalLinkInput.value = myWebLink;
      resultBox.style.display = 'block';

      // Update player
      mainVideo.innerHTML = '';
      mainVideo.src = videoUrl;
      mainVideo.load();
      mainVideo.play().catch(e => console.log(e));

    } else {
      statusText.innerText = "Gagal: " + (data.message || "Gagal memproses");
    }
  } catch (err) {
    statusText.innerText = "Terjadi kesalahan koneksi.";
  }
}

// BUKA VIDEO OTOMATIS SAAT ORANG LAIN KLIK LINK KAMU
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const videoFromLink = urlParams.get('v');

  if (videoFromLink) {
    const mainVideo = document.getElementById('mainVideo');
    if (mainVideo) {
      const decodedUrl = decodeURIComponent(videoFromLink);
      mainVideo.innerHTML = '';
      mainVideo.src = decodedUrl;
      mainVideo.load();
      mainVideo.play().catch(e => console.log(e));
    }
  }
});
</script>

</body>
</html>
