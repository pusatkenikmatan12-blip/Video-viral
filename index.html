<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>websiteku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        websiteku
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Cari video..."
        >
    </div>
</header>

<main>

<section class="hero">

<div class="video-card" data-title="Video Viral Terbaru">

<video
id="mainVideo"
controls
preload="metadata"
poster="https://dummyimage.com/800x450/111827/ffffff&text=Websiteku"
>
<source src="https://cdn2.sliwtdrive.com/BIYDvcux1.mp4" type="video/mp4">
</video>

<div class="btn-group">
<button onclick="downloadVideo()">Download Video</button>
<button onclick="playAgain()">Putar Ulang</button>
</div>

</div>

</main>

<script src="script.js"></script>
<!-- Form Remote Upload -->
<div style="max-width: 400px; margin: 20px auto; text-align: center; font-family: sans-serif;">
  <h3>Remote Upload Video</h3>
  <input type="text" id="videoUrlInput" placeholder="Masukkan URL Direct Video (.mp4)" style="width: 100%; padding: 8px; margin-bottom: 10px;">
  <button onclick="prosesRemoteUpload()" style="padding: 8px 16px; cursor: pointer;">Upload Sekarang</button>
  <p id="statusText" style="margin-top: 10px; font-weight: bold;"></p>
</div>

 
<script>
  async function prosesRemoteUpload() {    const videoUrl = document.getElementById('videoUrlInput').value;async function prosesRemoteUpload() {
  const videoUrl = document.getElementById('videoUrlInput').value;
  const statusText = document.getElementById('statusText');
  const mainVideo = document.getElementById('mainVideo');

  if(!videoUrl) {
    statusText.innerText = "Masukkan link video dulu!";
    return;
  }

  statusText.innerText = "Sedang memproses video...";

  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ videoUrl: videoUrl })
    });

    const data = await res.json();

    if (data.success) {
      statusText.innerText = "Berhasil dimuat!";
      
      // --- PERBAIKAN DI SINI ---
      // Cari elemen <source> di dalam video, atau pasang src langsung
      let sourceElement = mainVideo.querySelector('source');
      if (sourceElement) {
        sourceElement.src = videoUrl;
      } else {
        mainVideo.src = videoUrl;
      }
      
      mainVideo.load(); // Reload pemutar video
      mainVideo.play().catch(e => console.log("Autoplay diblokir browser:", e));

    } else {
      statusText.innerText = "Gagal: " + data.message;
    }
  } catch (err) {
    statusText.innerText = "Terjadi kesalahan koneksi.";
  }
}
</script>
</body>
</html>
